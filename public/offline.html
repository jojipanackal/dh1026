<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Jeera — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a0a0a; color: #f4f4f5; }
      body { min-height: 100svh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); border: 1px solid #27272a; border-radius: 18px; padding: 28px; background: #111113; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0; color: #a1a1aa; line-height: 1.6; font-size: 14px; }
      .mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; margin-bottom: 20px; background: #4f46e5; color: white; font-weight: 700; font-size: 20px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">J</div>
      <h1>You're offline</h1>
      <p>Jeera needs a connection to load current tasks and send updates. Reconnect and try again.</p>
    </main>
  </body>
</html>
